[project]
name = "renaimedia"
version = "0.1.0"
description = "Rename Media Files Using AI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14"
authors = [
    { name = "lsk242" },
]
dependencies = [
    "guessit>=4.1",
    "httpx>=0.28",
    "parse-torrent-name>=1.1",
    "python-dotenv>=1.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.12",
    "mypy>=1.16",
    "pytest>=8",
    "pytest-cov>=6",
]

[project.scripts]
renaimedia = "renaimedia.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["renaimedia"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["guessit", "PTN"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-v", "--cov=renaimedia", "--cov-report=term-missing"]
